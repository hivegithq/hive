[package]
name = "hive-cli"
version = "1.6.0"
description = "Command-line client for Hive: join the swarm from any git checkout"
edition.workspace = true
license.workspace = true

[[bin]]
name = "hive"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4.6", features = ["derive", "env"] }
hive-merge = { path = "../hive-merge" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3.4", features = ["json"] }
